<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calculadora de Numerologia</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f5f8fb;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#2563eb;
      --accent-2:#10b981;
      --soft:#eef2ff;
      --danger:#ef4444;
      --radius:12px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body {
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 400px at 10% 10%, #eef9ff 0%, transparent 15%),
                  radial-gradient(1000px 350px at 90% 90%, #f6fff6 0%, transparent 12%),
                  var(--bg);
      color:#0f172a;
      margin:0;
      padding:32px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .wrap{
      width:100%;
      max-width:980px;
      margin:0 auto;
    }

    header.app-header{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
    }
    header h1{
      margin:0;
      font-size:20px;
      font-weight:600;
      color:#0b1220;
    }
    header p {
      margin:0;
      color:var(--muted);
      font-size:13px;
    }

    .card {
      background:var(--card);
      border-radius:var(--radius);
      box-shadow: 0 6px 22px rgba(15,23,42,0.06);
      padding:18px;
      margin-bottom:16px;
    }

    .controls{
      display:grid;
      grid-template-columns: 1fr 220px;
      gap:12px;
      align-items:end;
    }

    label{
      display:block;
      font-size:13px;
      color:var(--muted);
    }

    input[type="text"], input[type="date"]{
      width:100%;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid #e6eef8;
      background:#fbfdff;
      font-size:15px;
      outline:none;
      transition:box-shadow .15s, border-color .15s;
    }
    input[type="text"]:focus, input[type="date"]:focus{
      box-shadow:0 6px 18px rgba(37,99,235,0.08);
      border-color: rgba(37,99,235,0.5);
    }

    .buttons{
      display:flex;
      gap:10px;
      flex-direction:column;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 12px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      font-weight:600;
      font-size:14px;
      transition:transform .08s ease, box-shadow .12s ease;
    }
    .btn:active{transform:translateY(1px)}
    .btn-primary{
      background:linear-gradient(180deg,var(--accent) 0%, #1749d1 100%);
      color:white;
      box-shadow: 0 6px 18px rgba(37,99,235,0.14);
    }
    .btn-ghost{
      background:transparent;
      color:var(--accent);
      border:1px solid rgba(37,99,235,0.08);
    }

    .result-grid{
      display:grid;
      grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
      gap:12px;
    }

    .resultado {
      margin-top:18px;
      padding:16px;
      border-radius:10px;
      background:linear-gradient(180deg,#ffffff, #fbfdff);
      box-shadow: 0 8px 28px rgba(2,6,23,0.04);
    }

    .bloco {
      padding:12px;
      border-radius:9px;
      background: linear-gradient(180deg, #ffffff, #fbfcff);
      border:1px solid #eef5ff;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .bloco:hover{
      transform:translateY(-4px);
      box-shadow: 0 14px 40px rgba(8,15,44,0.06);
    }

    .bloco strong { display:flex; align-items:center; gap:8px; font-size:15px; }
    .numero-destaque { color:var(--accent); font-weight:700; font-size:18px; }

    .info-toggle {
      cursor:pointer;
      color:var(--muted);
      font-size:13px;
      border:none;
      background:transparent;
      padding:0;
    }
    .info-body { display:none; margin-top:8px; color:#374151; font-size:13px; }

    .small { font-size:13px; color:var(--muted) }

    /* responsive */
    @media (max-width:760px){
      .controls { grid-template-columns: 1fr; }
      .buttons { flex-direction:row; }
      header h1{ font-size:18px }
    }

    /* print styles */
    @media print{
      body{background:transparent;padding:0}
      .card, .resultado{box-shadow:none;border-radius:0}
      .controls, .buttons, header { display:none !important; }
      .bloco { page-break-inside:avoid; border:1px solid #f0f0f0; }
    }

    /* info icon inline SVG style */
    .icon {
      width:18px;height:18px;display:inline-block;vertical-align:middle;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div>
        <h1>Calculadora de Numerologia</h1>
        <p>Introduz o teu nome e data de nascimento para obter o relatório numerológico.</p>
      </div>
    </header>

    <div class="card">
      <form id="form" onsubmit="event.preventDefault(); calcular();" aria-label="Formulário de cálculos numerológicos">
        <div class="controls">
          <div>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="ex. Maria da Silva" autocomplete="name" />
            <div style="height:8px"></div>
            <label for="data">Data de nascimento</label>
            <input type="date" id="data" />
          </div>

          <div class="buttons" aria-hidden="false" style="align-self:start">
            <button type="button" class="btn btn-primary" onclick="calcular()" aria-label="Calcular relatório">
              <!-- simple SVG icon -->
              <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Calcular
            </button>
            <button type="button" class="btn btn-ghost" onclick="imprimirRelatorio()" aria-label="Imprimir relatório">
              Imprimir Relatório
            </button>
          </div>
        </div>
      </form>
    </div>

    <div id="resultado" class="resultado card">
      <div style="color:#6b7280">
        Introduz o nome completo e a data de nascimento e carrega em "Calcular" para ver o relatório.
      </div>
    </div>
  </div>

  <script>
    function toggleInfo(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.display = el.style.display === "none" ? "block" : "none";
    }

    function reduzirSemMestres(numero) {
      let atual = Number(numero) || 0;
      while (atual > 9) {
        atual = atual.toString().split('').map(Number).reduce((a,b)=>a+b,0);
      }
      return atual;
    }

    function reduzirComMestres(numero) {
      let atual = Number(numero) || 0;
      while (atual > 9) {
        if ([11,22,33,44].includes(atual)) return atual;
        atual = atual.toString().split('').map(Number).reduce((a,b)=>a+b,0);
      }
      return atual;
    }

    function desdobramentoComMestres(numero) {
      let soma = Number(numero) || 0;
      const passos = [soma];
      while (soma > 9) {
        if ([11,22,33,44].includes(soma)) break;
        soma = soma.toString().split('').map(Number).reduce((a,b)=>a+b,0);
        passos.push(soma);
      }
      return passos.join(" → ");
    }

    // Formata a exibição do número: se o desdobramento for igual ao final, mostra só o número final
    function formatNumeroDisplay(desdobramentoStr, numeroFinal) {
      if (!desdobramentoStr) return String(numeroFinal);
      // normalizar espaços
      const des = desdobramentoStr.toString().trim();
      if (des === String(numeroFinal)) return String(numeroFinal);
      return `${des} / ${numeroFinal}`;
    }

    function letraParaNumero(letra) {
      const mapa = {
        A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,
        J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,
        S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8
      };
      return mapa[(letra || '').toUpperCase()] || 0;
    }

    function somaLetras(palavra) {
      if (!palavra) return 0;
      return palavra.split('').map(letraParaNumero).reduce((a,b)=>a+b,0);
    }

    function calcular() {
      const dataVal = document.getElementById("data").value;
      const nomeRaw = document.getElementById("nome").value || "";
      const nome = nomeRaw.replace(/\s+/g,'').trim();

      if (!dataVal || nome.length === 0) {
        alert("Por favor, introduz a data de nascimento e o nome completo.");
        return;
      }

      const parts = dataVal.split("-");
      if (parts.length !== 3) {
        alert("Data com formato inválido. Usa o seletor de data.");
        return;
      }

      const [anoStr, mesStr, diaStr] = parts;
      const ano = Number(anoStr);
      const mes = Number(mesStr);
      const dia = Number(diaStr);

      const diaReduzido = reduzirSemMestres(dia);
      const mesReduzido = reduzirSemMestres(mes);
      const anoReduzido = reduzirSemMestres(ano);

      // Caminho de Vida
      const digitosData = dataVal.replace(/-/g, "").split("").map(Number);
      const somaCaminhoVida = digitosData.reduce((a,b)=>a+b,0);
      const caminhoVidaFinal = reduzirComMestres(somaCaminhoVida);
      const caminhoVidaDesdobrado = desdobramentoComMestres(somaCaminhoVida);

      // Via de Missão
      const somaMissao = diaReduzido + mesReduzido;
      const viaMissaoFinal = reduzirComMestres(somaMissao);
      const viaMissaoDesdobrada = desdobramentoComMestres(somaMissao);

      // Heranças Kármicas
      const primeiraHeranca = `${diaReduzido} - ${mesReduzido} = ${Math.abs(diaReduzido - mesReduzido)}`;
      const segundaHeranca = `${diaReduzido} - ${anoReduzido} = ${Math.abs(diaReduzido - anoReduzido)}`;
      const terceiraHerancaPar = `${Math.abs(diaReduzido - mesReduzido)} - ${Math.abs(diaReduzido - anoReduzido)}`;

      // Desafios Kármicos
      const primeiroDesafio = terceiraHerancaPar; 
      const segundoDesafio = `${mesReduzido} - ${anoReduzido}`;
      const terceiroDesafioPar = `${Math.abs(Math.abs(diaReduzido - mesReduzido) - Math.abs(diaReduzido - anoReduzido))} - ${Math.abs(mesReduzido - anoReduzido)}`;

      // Karma Acumulado
      const karmaAcumulado = Math.abs(Math.abs(diaReduzido - mesReduzido)) + Math.abs(Math.abs(diaReduzido - anoReduzido)) +
                             Math.abs(Math.abs(Math.abs(diaReduzido - mesReduzido) - Math.abs(diaReduzido - anoReduzido))) +
                             Math.abs(Math.abs(mesReduzido - anoReduzido));

      // Ciclos de Vida
      const primeiroCiclo = diaReduzido + mesReduzido;
      const segundoCiclo = diaReduzido + anoReduzido;
      const terceiroCiclo = primeiroCiclo + segundoCiclo;
      const quartoCiclo = mesReduzido + anoReduzido;

      const primeiroCicloReduzido = reduzirSemMestres(primeiroCiclo);
      const segundoCicloReduzido = reduzirSemMestres(segundoCiclo);
      const terceiroCicloReduzido = reduzirSemMestres(terceiroCiclo);
      const quartoCicloReduzido = reduzirSemMestres(quartoCiclo);

      const inicio1 = 0;
      const fim1 = 36 - caminhoVidaFinal;
      const inicio2 = fim1 + 1;
      const fim2 = inicio2 + 9 - 1;
      const inicio3 = fim2 + 1;
      const fim3 = inicio3 + 9 - 1;
      const inicio4 = fim3 + 1;
      const fim4 = inicio4 + 9 - 1;

      const objetivoKarmico = primeiroCicloReduzido + segundoCicloReduzido + terceiroCicloReduzido + quartoCicloReduzido;

      // Números do Nome
      const numeroExpressao = reduzirComMestres(somaLetras(nome));
      const vogais = nomeRaw.replace(/[^AEIOU]/gi,'');
      const numeroAlma = reduzirComMestres(somaLetras(vogais));
      const consoantes = nomeRaw.replace(/[^BCDFGHJKLMNPQRSTVWXYZ]/gi,'');
      const numeroImagem = reduzirComMestres(somaLetras(consoantes));

      const pontoForte = numeroExpressao + numeroAlma + numeroImagem;
      const pontoForteReduzido = reduzirComMestres(pontoForte);

      const numeroFinal = caminhoVidaFinal + pontoForteReduzido;
      const numeroFinalReduzido = reduzirComMestres(numeroFinal);

      const numeroPoder = numeroExpressao + caminhoVidaFinal;
      const numeroStress = numeroExpressao - caminhoVidaFinal;
      const numeroReativo = numeroFinalReduzido + numeroFinalReduzido;
      const numeroReativoReduzido = reduzirComMestres(numeroReativo);

      // Preparar exibições formatadas (mostrar apenas um número quando desdobramento === final)
      const caminhoVidaDisplay = formatNumeroDisplay(caminhoVidaDesdobrado, caminhoVidaFinal);
      const viaMissaoDisplay = formatNumeroDisplay(viaMissaoDesdobrada, viaMissaoFinal);

      // Mostrar resultados
      document.getElementById("resultado").innerHTML = `
        <div class="result-grid">
          <div class="bloco">
            <strong>Caminho de Vida <button class="info-toggle" onclick="toggleInfo('info-cv')">ⓘ</button></strong>
            <div id="info-cv" class="info-body">Representa a direção principal da tua vida e o tipo de experiências que és chamada a viver.</div>
            <div style="margin-top:8px"><span class="numero-destaque">${caminhoVidaDisplay}</span></div>
          </div>

          <div class="bloco">
            <strong>Via de Missão <button class="info-toggle" onclick="toggleInfo('info-vm')">ⓘ</button></strong>
            <div id="info-vm" class="info-body">Indica de que forma colocas o teu potencial em ação no mundo.</div>
            <div style="margin-top:8px"><span class="numero-destaque">${viaMissaoDisplay}</span></div>
          </div>

          <div class="bloco">
            <strong>Heranças Kármicas <button class="info-toggle" onclick="toggleInfo('info-herancas')">ⓘ</button></strong>
            <div id="info-herancas" class="info-body">Talentos ou bloqueios herdados de vidas passadas, analisados aos pares.</div>
            <div style="margin-top:8px" class="small">
              1ª Herança: <span class="numero-destaque">${primeiraHeranca}</span><br>
              2ª Herança: <span class="numero-destaque">${segundaHeranca}</span><br>
              3ª Herança (par): <span class="numero-destaque">${terceiraHerancaPar}</span>
            </div>
          </div>

          <div class="bloco">
            <strong>Desafios Kármicos <button class="info-toggle" onclick="toggleInfo('info-desafios')">ⓘ</button></strong>
            <div id="info-desafios" class="info-body">Obstáculos ou lições que precisas de superar, vistos aos pares.</div>
            <div style="margin-top:8px" class="small">
              1º Desafio (par da 3ª herança): <span class="numero-destaque">${primeiroDesafio}</span><br>
              2º Desafio (mês - ano): <span class="numero-destaque">${segundoDesafio}</span><br>
              3º Desafio (par dos resultados anteriores): <span class="numero-destaque">${terceiroDesafioPar}</span><br>
              Karma Acumulado: <span class="numero-destaque">${karmaAcumulado}</span>
            </div>
          </div>

          <div class="bloco">
            <strong>Ciclos de Vida (Pináculos) <button class="info-toggle" onclick="toggleInfo('info-ciclos')">ⓘ</button></strong>
            <div id="info-ciclos" class="info-body">Diferentes fases da tua vida, desafios e oportunidades de cada período.</div>
            <div style="margin-top:8px" class="small">
              1º Ciclo: <span class="numero-destaque">${primeiroCicloReduzido}</span> (dos ${inicio1} aos ${fim1} anos)<br>
              2º Ciclo: <span class="numero-destaque">${segundoCicloReduzido}</span> (dos ${inicio2} aos ${fim2} anos)<br>
              3º Ciclo: <span class="numero-destaque">${terceiroCicloReduzido}</span> (dos ${inicio3} aos ${fim3} anos)<br>
              4º Ciclo: <span class="numero-destaque">${quartoCicloReduzido}</span> (dos ${inicio4} aos ${fim4} anos)<br>
              Objetivo Kármico: <span class="numero-destaque">${objetivoKarmico}</span>
            </div>
          </div>

          <div class="bloco">
            <strong>Número de Expressão <button class="info-toggle" onclick="toggleInfo('info-expressao')">ⓘ</button></strong>
            <div id="info-expressao" class="info-body">Talentos, personalidade e forma de te expressares.</div>
            <div style="margin-top:8px"><span class="numero-destaque">${numeroExpressao}</span></div>
          </div>

          <div class="bloco">
            <strong>Número de Alma <button class="info-toggle" onclick="toggleInfo('info-alma')">ⓘ</button></strong>
            <div id="info-alma" class="info-body">Desejos internos, motivações e o que te faz sentir realizada.</div>
            <div style="margin-top:8px"><span class="numero-destaque">${numeroAlma}</span></div>
          </div>

          <div class="bloco">
            <strong>Número de Imagem <button class="info-toggle" onclick="toggleInfo('info-imagem')">ⓘ</button></strong>
            <div id="info-imagem" class="info-body">Como os outros te percebem e como te apresentas.</div>
            <div style="margin-top:8px"><span class="numero-destaque">${numeroImagem}</span></div>
          </div>

          <div class="bloco">
            <strong>Ponto Forte da Personalidade <button class="info-toggle" onclick="toggleInfo('info-pfp')">ⓘ</button></strong>
            <div id="info-pfp" class="info-body">Soma do Número de Expressão + Número de Alma + Número de Imagem, reduzido a um dígito.</div>
            <div style="margin-top:8px"><span class="numero-destaque">${pontoForteReduzido}</span></div>
          </div>

          <div class="bloco" style="grid-column: 1 / -1;">
            <strong>Número Final, Poder, Stress, Número Reativo</strong>
            <div style="margin-top:8px" class="small">
              Número Final: <span class="numero-destaque">${numeroFinalReduzido}</span><br>
              Número do Poder: <span class="numero-destaque">${numeroPoder}</span><br>
              Número do Stress: <span class="numero-destaque">${numeroStress}</span><br>
              Número Reativo: <span class="numero-destaque">${numeroReativoReduzido}</span>
            </div>
          </div>
        </div>
      `;

      // Scroll to results
      document.getElementById('resultado').scrollIntoView({ behavior: 'smooth' });
    }

    function imprimirRelatorio() {
      const conteudo = document.getElementById('resultado').innerHTML;
      if (!conteudo || conteudo.trim() === "" || conteudo.includes("Introduz o teu nome")) {
        alert("Não há nada para imprimir. Calcula primeiro o relatório.");
        return;
      }

      // Ler os campos atuais (para que o cabeçalho do relatório reflita o que está nos inputs)
      const nomeVal = (document.getElementById('nome').value || '').trim();
      const dataVal = document.getElementById('data').value || '';

      // Formatar a data para um formato mais legível (PT)
      let dataFormatada = dataVal;
      if (dataVal) {
        // dataVal é 'YYYY-MM-DD'
        const d = new Date(dataVal + 'T00:00:00'); // evita timezone
        if (!isNaN(d)) {
          dataFormatada = d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }
      }

      const janela = window.open('', '', 'width=900,height=700');
      if (!janela) {
        alert("Impossível abrir nova janela — verifica o bloqueador de pop-ups.");
        return;
      }

      // Cabeçalho com nome e data + estilo para impressão
      const css = `
        body{font-family:Arial,sans-serif;line-height:1.6;padding:20px;color:#111;}
        h1{margin-top:0;}
        .header{margin-bottom:12px;border-bottom:1px solid #ddd;padding-bottom:8px;}
        .info{margin-bottom:12px;font-size:15px;color:#333;}
        .numero-destaque{color:${escapeHtmlVar('--accent', '#2563eb')};font-weight:bold;}
        .bloco{padding:10px;margin-bottom:10px;border-radius:6px;background:#f7f7f7;}
      `;

      const headerHtml = `
        <div class="header">
          <h1>Relatório de Numerologia</h1>
          <div class="info"><strong>Nome:</strong> ${escapeHtml(nomeVal) || '—'}<br>
          <strong>Data de nascimento:</strong> ${escapeHtml(dataFormatada) || '—'}</div>
        </div>
      `;

      janela.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Relatório de Numerologia</title>');
      janela.document.write('<style>' + css + '</style>');
      janela.document.write('</head><body>');
      janela.document.write(headerHtml);
      janela.document.write(conteudo);
      janela.document.write('</body></html>');
      janela.document.close();
      janela.focus();
      // esperar um pouco pode ajudar em alguns navegadores antes de imprimir
      setTimeout(()=>janela.print(), 250);
    }

    // Função simples para escapar conteúdo que venha dos inputs (evita injection de HTML)
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"'\/]/g, function (m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;","/":"&#47;"}[m];
      });
    }

    // small helper: escape used for CSS var fallback in print css string above
    function escapeHtmlVar(varName, fallback) {
      // browsers won't allow reading CSS variables here safely across contexts;
      // usamos fallback direto (código usa valor por defeito).
      return fallback;
    }
  </script>
</body>
</html>
